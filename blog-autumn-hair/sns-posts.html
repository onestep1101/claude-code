function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  html += `<h2>${esc(p.name)}</h2><div class="rule">作法：${esc(p.rule)}</div>`;
  p.posts.forEach(po=>{
    const a='t'+n, b='j'+n, c='e'+n; n++;
    html += `<div class="card">
    <div class="meta"><strong>${esc(po.pat)}</strong> <span class="count">（投稿文 ${po.text.length}字）</span></div>
    <div class="lbl">投稿文</div><pre id="${a}">${esc(po.text)}</pre><button data-target="${a}">コピー</button>
    <div class="lbl">画像生成プロンプト（日本語）</div><pre id="${b}">${esc(po.jp)}</pre><button data-target="${b}">コピー</button>
    <div class="lbl">画像生成プロンプト（英語）</div><pre id="${c}">${esc(po.en)}</pre><button data-target="${c}">コピー</button>
    </div>`;
  });
});
document.getElementById('root').innerHTML = html;

document.addEventListener('click', e=>{
  const b = e.target.closest('button[data-target]'); if(!b) return;
  const text = document.getElementById(b.dataset.target).textContent;
  const done = ()=>{ const o=b.textContent; b.textContent='コピーしました ✓'; b.classList.add('done'); setTimeout(()=>{b.textContent=o; b.classList.remove('done');},1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
  } else fallback(text,done);
});
function fallback(text, done){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(_){} document.body.removeChild(ta);
}
